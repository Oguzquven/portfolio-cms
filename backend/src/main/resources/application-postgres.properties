# Activate with: --spring.profiles.active=postgres
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:portfolio}
spring.datasource.password=${DATABASE_PASSWORD:portfolio}

# Flyway owns the schema. Hibernate only verifies that entities and tables agree.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
