spring.application.name=portfolio-api
server.port=${PORT:8080}
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Development defaults. Set these environment variables before production.
portfolio.admin.email=${PORTFOLIO_ADMIN_EMAIL:admin@portfolio.dev}
portfolio.admin.password=${PORTFOLIO_ADMIN_PASSWORD:Admin123!}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=${PORTFOLIO_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.secure=${PORTFOLIO_COOKIE_SECURE:false}
portfolio.auth.max-attempts=${PORTFOLIO_AUTH_MAX_ATTEMPTS:5}
portfolio.auth.lock-minutes=${PORTFOLIO_AUTH_LOCK_MINUTES:15}
portfolio.media.upload-dir=${PORTFOLIO_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
